name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SDK_FILE: immortalwrt-sdk-25.12.1-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  SDK_SHA256: 5aa940fd577efbc87bccdcedd4ccd0154b14815cde41248c003d1f0e1bea31a5

jobs:
  build:
    name: ImmortalWrt 25.12.1 rockchip/armv8
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 python3-pyelftools \
            python3-setuptools rsync \
            swig unzip zlib1g-dev file wget curl zstd

      - name: Download and verify ImmortalWrt SDK
        env:
          SDK_BASE_URL: https://downloads.immortalwrt.org/releases/25.12.1/targets/rockchip/armv8
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/$SDK_FILE" \
            "$SDK_BASE_URL/$SDK_FILE"
          echo "$SDK_SHA256  $RUNNER_TEMP/$SDK_FILE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/immortalwrt-sdk"
          tar --use-compress-program=unzstd \
            --extract --file "$RUNNER_TEMP/$SDK_FILE" \
            --directory "$RUNNER_TEMP/immortalwrt-sdk" \
            --strip-components=1

      - name: Prepare package feeds
        working-directory: ${{ runner.temp }}/immortalwrt-sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add luci-app-socks-proxy source
        run: |
          mkdir -p "$RUNNER_TEMP/immortalwrt-sdk/package/luci-app-socks-proxy"
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            "$GITHUB_WORKSPACE/" \
            "$RUNNER_TEMP/immortalwrt-sdk/package/luci-app-socks-proxy/"
          test -x "$RUNNER_TEMP/immortalwrt-sdk/package/luci-app-socks-proxy/root/etc/init.d/socks-proxy"
          test -x "$RUNNER_TEMP/immortalwrt-sdk/package/luci-app-socks-proxy/root/usr/libexec/socks-proxy/generate.uc"
          test -x "$RUNNER_TEMP/immortalwrt-sdk/package/luci-app-socks-proxy/root/usr/libexec/socks-proxy/import"
          test -x "$RUNNER_TEMP/immortalwrt-sdk/package/luci-app-socks-proxy/root/usr/libexec/socks-proxy/import.uc"
          test -x "$RUNNER_TEMP/immortalwrt-sdk/package/luci-app-socks-proxy/root/usr/libexec/socks-proxy/status"

      - name: Build APK
        working-directory: ${{ runner.temp }}/immortalwrt-sdk
        run: |
          make defconfig
          make package/luci-app-socks-proxy/compile -j"$(nproc)" V=s

      - name: Collect package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find "$RUNNER_TEMP/immortalwrt-sdk/bin/packages" \
            -type f -name 'luci-app-socks-proxy-*.apk' \
            -exec cp -v {} "$GITHUB_WORKSPACE/dist/" \;
          test -n "$(find "$GITHUB_WORKSPACE/dist" -name '*.apk' -print -quit)"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum ./*.apk > SHA256SUMS

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-socks-proxy-0.1.0-r2
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
